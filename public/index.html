<script type="text/javascript">
    (function () {
        var config = window.__AUTO_TRANSLATE_CONFIG || { enabled: true };
        var storageKey = "easyerp:translate:enabled";
        var enabled = typeof config.enabled === "boolean"
            ? config.enabled
            : (localStorage.getItem(storageKey) !== "0");

        function ensureStyle() {
            var style = document.createElement("style");
            style.type = "text/css";
            style.appendChild(document.createTextNode(
                ".skiptranslate{display:none !important;}" +
                "body{top:0 !important;}"
            ));
            document.head.appendChild(style);
        }

        function markNoTranslate(root) {
            var selector = "input, textarea, select, [contenteditable='true'], pre, code, .CodeMirror, .CodeMirror *";
            var nodes = (root || document).querySelectorAll(selector);
            for (var i = 0; i < nodes.length; i++) {
                if (nodes[i].classList && !nodes[i].classList.contains("notranslate")) {
                    nodes[i].classList.add("notranslate");
                }
            }
        }

        function observeNewInputs() {
            if (!window.MutationObserver) {
                return;
            }

            var observer = new MutationObserver(function (mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    var mutation = mutations[i];
                    for (var j = 0; j < mutation.addedNodes.length; j++) {
                        var node = mutation.addedNodes[j];
                        if (node && node.nodeType === 1) {
                            markNoTranslate(node);
                        }
                    }
                }
            });

            observer.observe(document.body, { childList: true, subtree: true });
        }

        function loadGoogleTranslate() {
            if (!enabled) {
                return;
            }

            var holder = document.createElement("div");
            holder.id = "google_translate_element";
            holder.style.display = "none";
            document.body.appendChild(holder);

            window.googleTranslateElementInit = function () {
                new window.google.translate.TranslateElement({
                    pageLanguage: "en",
                    includedLanguages: "zh-CN",
                    autoDisplay: false
                }, "google_translate_element");
            };

            document.cookie = "googtrans=/en/zh-CN; path=/";

            var gtScript = document.createElement("script");
            gtScript.type = "text/javascript";
            gtScript.async = true;
            gtScript.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
            document.head.appendChild(gtScript);
        }

        window.EasyErpTranslate = {
            enable: function () {
                localStorage.setItem(storageKey, "1");
                location.reload();
            },
            disable: function () {
                localStorage.setItem(storageKey, "0");
                location.reload();
            },
            isEnabled: function () {
                return enabled;
            }
        };

        if (!enabled) {
            return;
        }

        function onReady() {
            ensureStyle();
            markNoTranslate(document);
            observeNewInputs();
            loadGoogleTranslate();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", onReady);
        } else {
            onReady();
        }
    })();
</script>
